name: Android APK

# Builds the signed Android app and attaches it to the "app-v<version>"
# release. That release is never marked "latest", so the bot's
# releases/latest/download/... links keep pointing at the bot release.
on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/app-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 is not set - the APK is signed with a debug key."
          fi

      - name: Build
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Verify signature
        run: |
          VERSION=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)
          APK="FortniteMissions-v${VERSION}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          "$BT/aapt2" dump badging "$APK" | head -3
          echo "APK=$APK" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}

      - name: Publish to the app release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="app-v${VERSION}"
          NOTES="Fortnite Missions app v${VERSION} for Android. Personal use only, not for sale. Fortnite names, icons and art belong to Epic Games, Inc. Use at your own risk. The same app runs in any browser: https://plus98ir.github.io/Fortnite_Missions/app/"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "Fortnite Missions app v${VERSION}" \
              --notes "$NOTES" --latest=false
          fi
