name: App data

# Rebuilds app/data (missions, weekly reward, icons) with the bot's own code
# after every daily reset, and a few more times while the sources settle.
on:
  schedule:
    - cron: "7 0 * * *"
    - cron: "30 0 * * *"
    - cron: "10 1 * * *"
    - cron: "0 4 * * *"
    - cron: "0 12 * * *"
  push:
    branches: [main]
    paths:
      - install_fortnite_bot.sh
      - app/tools/build_data.py
      - app/art/**
      - app/weekly-override.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the bot's requirements
        run: |
          sed -n "/<<'REQ_EOF'/,/^REQ_EOF$/p" install_fortnite_bot.sh | sed '1d;$d' > /tmp/requirements.txt
          cat /tmp/requirements.txt
          pip install -q -r /tmp/requirements.txt

      - name: Build data
        env:
          SEASON_START_UTC: ${{ vars.SEASON_START_UTC }}
          SEASON_END_UTC: ${{ vars.SEASON_END_UTC }}
          WEEKLY_URL2: ${{ vars.WEEKLY_URL2 }}
        run: |
          # Unset repo variables arrive as empty strings: drop them so the
          # bot's own defaults apply.
          for v in SEASON_START_UTC SEASON_END_UTC WEEKLY_URL2; do
            [ -z "${!v}" ] && unset $v
          done
          python app/tools/build_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/data
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -q -m "App data $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull -q --rebase origin main
          git push -q origin HEAD:main
